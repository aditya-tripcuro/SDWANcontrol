# WANControl v2 Configuration
# Run 'python -m wancontrol.discover' to auto-detect interfaces and generate this file.
# All values are hot-reloadable via SIGHUP or POST /api/config/reload (except db_path).

# ── WAN Interfaces ────────────────────────────────────────────────────────────
interfaces:
  - name: "enp2s0"
    label: "LAN-1 (Primary)"
    expected_speed_mbps: 1000
    gateway: "192.168.1.1"
    routing_table_id: 100

  - name: "enp3s0"
    label: "LAN-2 (Backup)"
    expected_speed_mbps: 100
    gateway: "192.168.11.1"
    routing_table_id: 101

  - name: "wlp5s0"
    label: "WiFi"
    expected_speed_mbps: 100
    gateway: "192.168.0.1"
    routing_table_id: 102

# ── WAN Mode ──────────────────────────────────────────────────────────────────
# failover     : One active WAN at a time; switch on failure.
# load_balance : All healthy WANs active; weighted by expected_speed_mbps.
wan_mode: "load_balance"

# ── Probes ────────────────────────────────────────────────────────────────────
probes:
  interval_sec: 1
  dns_targets:
    - "8.8.8.8"
    - "1.1.1.1"
    - "9.9.9.9"
  icmp_targets:
    - "8.8.8.8"
    - "1.1.1.1"
    - "94.140.14.14"
  http_targets:
    - "http://connectivitycheck.gstatic.com/generate_204"
    - "http://detectportal.firefox.com/success.txt"
  icmp_count: 5
  icmp_timeout_sec: 3
  dns_timeout_sec: 3
  http_timeout_sec: 5

# ── Scoring ───────────────────────────────────────────────────────────────────
scoring:
  latency_penalty_per_ms: 0.3
  loss_penalty_per_percent: 2.0
  dns_fail_penalty: 15
  http_fail_penalty: 20
  hard_fail_threshold: 20
  # failover mode only:
  hysteresis_switch_to_backup: 25
  hysteresis_return_to_primary: 10
  # load_balance mode only:
  # Interface is removed from nexthop set when score < hard_fail_threshold
  # and re-added when score recovers above hard_fail_threshold + recovery_margin
  recovery_margin: 10
  # ── Anti-flap (items 11/16) ──
  # A link is only declared FAILED after this many consecutive hard-fail cycles,
  # and only declared recovered after this many consecutive healthy cycles.
  # Guards against false readings / short drops causing route thrash.
  fail_confirmations: 3
  recover_confirmations: 5
  # Never switch the active route more than once within this many seconds.
  min_switch_interval_sec: 60
  # In failover mode, a recovered primary must stay healthy this long before we
  # return to it (dwell). Replaces the previously hardcoded 30s.
  return_stability_sec: 30

# ── Controller ────────────────────────────────────────────────────────────────
controller:
  # Safe default for remote servers: observe only until Start is pressed/API-called.
  auto_start: false
  loop_interval_sec: 1
  benchmark_interval_sec: 300
  metric_collection_timeout_sec: 8
  heartbeat_interval_sec: 5
  heartbeat_stale_sec: 15

# ── Data Retention ────────────────────────────────────────────────────────────
retention:
  metrics_hours: 72
  events_days: 30
  prune_interval_min: 60
  # New tables introduced for usage graphs and speedtest history.
  usage_hours: 336        # 14 days of rx/tx samples
  speedtest_days: 90      # sparse rows; keep longer

# ── Usage sampling (rx/tx throughput per interface) ───────────────────────────
# Reads /proc/net/dev counters and persists Mbps so the UI can render a
# Windows-Task-Manager-style chart. Cheap; safe to leave on.
usage:
  enabled: true
  sample_interval_sec: 5

# ── Speedtest (Ookla CLI) ─────────────────────────────────────────────────────
# OFF by default. Toggle per interface from the UI (Metrics page) or list them
# under enabled_interfaces here. Requires the Ookla `speedtest` binary on PATH;
# if it's missing the runner stays idle (graceful no-op).
#   - binary_path: explicit path; empty = auto-detect via shutil.which("speedtest")
#   - interval_sec: minimum gap between automatic runs per interface
#   - run_timeout_sec: hard timeout for one CLI invocation
speedtest:
  enabled: false
  interval_sec: 3600
  binary_path: ""
  enabled_interfaces: []
  run_timeout_sec: 120

# ── Alerting ──────────────────────────────────────────────────────────────────
alerting:
  enabled: true
  webhooks:
    - url: "http://your-ntfy-server/wancontrol"
      method: POST
      headers:
        Title: "WANControl Alert"
      on_events:
        - "link_down"
        - "link_up"
        - "gateway_switch"
        - "interface_added_to_pool"
        - "interface_removed_from_pool"
        - "controller_error"

# ── Web Server ────────────────────────────────────────────────────────────────
server:
  # Listen on LAN and VPN interfaces. Keep this host behind a firewall/router:
  # allow TCP/23232 only from your private LAN and Tailscale ranges.
  host: "0.0.0.0"
  port: 23232
  # Keep this true for any shared/private LAN or VPN-exposed deployment.
  # Only set false for strictly localhost/SSH-tunnel-only access.
  auth_enabled: true
  # Optional IP allow-list. If non-empty, requests whose source address is not
  # inside one of these CIDRs are rejected before auth. Empty = allow any source
  # (auth still applies). The Tailscale CGNAT range (100.64.0.0/10) is shown as
  # an example; add your private LAN range(s) too if you reach the UI over LAN.
  allowed_cidrs: []
    # - "100.64.0.0/10"   # Tailscale tailnet
    # - "192.168.0.0/16"  # private LAN
  # Recommended: set WANCONTROL_SECRET_KEY via .env and keep this as a placeholder.
  # Generate a real key: python3 -c "import secrets; print(secrets.token_hex(32))"
  secret_key: "REPLACE_ME_run_python_secrets_token_hex_32"
  jwt_expiry_hours: 24
  session_timeout_minutes: 60

# ── File Paths ────────────────────────────────────────────────────────────────
lock_file: "/run/wancontrol/controller.lock"
heartbeat_file: "/run/wancontrol/controller.heartbeat"
db_path: "/var/lib/wancontrol/wan.db"
log_dir: "/var/lib/wancontrol/logs"
